<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 820" width="820" height="820">
  <defs>
    <style>
      .bg { fill: hsl(42,24%,95%); }
      .fg { fill: hsl(30,12%,18%); }
      .muted { fill: hsl(30,7%,48%); }
      .accent { fill: hsl(15,55%,48%); }
      .stroke-fg { stroke: hsl(30,12%,18%); fill: none; }
      .stroke-muted { stroke: hsl(30,7%,48%); fill: none; }
      .stroke-accent { stroke: hsl(15,55%,48%); fill: none; }
      .label { font-family: 'Intel One Mono', 'Courier New', monospace; font-size: 13px; letter-spacing: 0.4px; }
      .caption { font-family: 'Intel One Mono', 'Courier New', monospace; font-size: 11px; letter-spacing: 0.3px; }
      .small { font-family: 'Intel One Mono', 'Courier New', monospace; font-size: 10px; letter-spacing: 0.3px; }
      .tiny { font-family: 'Intel One Mono', 'Courier New', monospace; font-size: 9px; letter-spacing: 0.8px; }
      .heading { font-family: 'Intel One Mono', 'Courier New', monospace; font-size: 11px; font-weight: 700; letter-spacing: 2.5px; }
      .title { font-family: 'Intel One Mono', 'Courier New', monospace; font-size: 14px; font-weight: 700; letter-spacing: 1px; }
      .glyph { stroke: hsl(30,12%,18%); fill: none; stroke-width: 7; stroke-linecap: butt; stroke-linejoin: miter; }
    </style>
  </defs>

  <rect width="820" height="820" class="bg"/>

  <!-- =========================================================
       Vertical layout (world y coordinates)
         0–48    title strip
        78       consonants heading
       110–410   consonant cells (each cell ~300 tall)
       450       aside note
       475       dotted divider
       505       vowels heading
       540–660   vowel panels (primitives + combinations)
       680–706   yin/yang brackets
       740       summary caption
       765       dotted divider
       790–810   syllable block examples
       ========================================================= -->

  <!-- ===== TITLE STRIP ===== -->
  <text x="40" y="34" class="title fg">HANGUL · A SCRIPT THAT DIAGRAMS ITS OWN PHONOLOGY</text>
  <line x1="40" y1="48" x2="780" y2="48" class="stroke-fg" stroke-width="1"/>

  <!-- ===== CONSONANTS ===== -->
  <text x="40" y="82" class="heading fg">CONSONANTS — SHAPE FOLLOWS ARTICULATION</text>

  <!-- ===== CELL 1: VELAR ㄱ ===== -->
  <g transform="translate(70, 110)">
    <text x="100" y="0" class="tiny accent" text-anchor="middle">VELAR</text>
    <g transform="translate(20, 16)">
      <path d="M 8 14 Q 80 4, 158 14" class="stroke-fg" stroke-width="1.4"/>
      <path d="M 8 78 Q 80 86, 158 78" class="stroke-fg" stroke-width="1.4"/>
      <path d="M 8 14 Q 2 46, 8 78" class="stroke-fg" stroke-width="1.4"/>
      <path d="M 158 14 L 162 26 M 158 78 L 162 66" class="stroke-fg" stroke-width="1.4"/>
      <path d="M 145 80 Q 110 80, 80 74 Q 55 66, 35 36 Q 28 22, 22 26 Q 18 38, 24 58 Q 32 78, 60 84 Q 110 88, 145 84 Z" class="accent" opacity="0.85"/>
      <circle cx="28" cy="22" r="3.2" class="fg"/>
      <path d="M 28 -4 L 28 18 M 24 14 L 28 18 L 32 14" class="stroke-accent" stroke-width="1.1"/>
    </g>
    <text x="100" y="128" class="small muted" text-anchor="middle">dorsum meets soft palate</text>
    <path d="M 100 148 L 100 172 M 95 167 L 100 172 L 105 167" class="stroke-fg" stroke-width="1"/>
    <path d="M 70 192 L 130 192 L 130 250" class="glyph"/>
    <text x="100" y="282" class="label fg" text-anchor="middle">ㄱ  /k/</text>
    <text x="100" y="300" class="small muted" text-anchor="middle">velar stop</text>
  </g>

  <!-- ===== CELL 2: CORONAL ㄴ ===== -->
  <g transform="translate(300, 110)">
    <text x="100" y="0" class="tiny accent" text-anchor="middle">CORONAL</text>
    <g transform="translate(20, 16)">
      <path d="M 8 14 Q 80 4, 158 14" class="stroke-fg" stroke-width="1.4"/>
      <path d="M 8 78 Q 80 86, 158 78" class="stroke-fg" stroke-width="1.4"/>
      <path d="M 8 14 Q 2 46, 8 78" class="stroke-fg" stroke-width="1.4"/>
      <path d="M 158 14 L 162 26 M 158 78 L 162 66" class="stroke-fg" stroke-width="1.4"/>
      <path d="M 25 82 Q 40 80, 70 78 Q 100 76, 125 60 Q 142 44, 148 26 Q 142 22, 130 32 Q 110 56, 80 64 Q 50 70, 25 70 Z" class="accent" opacity="0.85"/>
      <circle cx="148" cy="22" r="3.2" class="fg"/>
      <path d="M 148 -4 L 148 18 M 144 14 L 148 18 L 152 14" class="stroke-accent" stroke-width="1.1"/>
    </g>
    <text x="100" y="128" class="small muted" text-anchor="middle">tongue tip at alveolar ridge</text>
    <path d="M 100 148 L 100 172 M 95 167 L 100 172 L 105 167" class="stroke-fg" stroke-width="1"/>
    <path d="M 70 192 L 70 250 L 130 250" class="glyph"/>
    <text x="100" y="282" class="label fg" text-anchor="middle">ㄴ  /n/</text>
    <text x="100" y="300" class="small muted" text-anchor="middle">coronal nasal</text>
  </g>

  <!-- ===== CELL 3: BILABIAL ㅁ ===== -->
  <g transform="translate(530, 110)">
    <text x="100" y="0" class="tiny accent" text-anchor="middle">BILABIAL</text>
    <g transform="translate(20, 16)">
      <path d="M 8 14 Q 80 4, 158 14" class="stroke-fg" stroke-width="1.4"/>
      <path d="M 8 78 Q 80 86, 158 78" class="stroke-fg" stroke-width="1.4"/>
      <path d="M 8 14 Q 2 46, 8 78" class="stroke-fg" stroke-width="1.4"/>
      <path d="M 158 14 L 162 16 L 162 76 L 158 78" class="accent" opacity="0.9"/>
      <path d="M 158 14 L 162 16 L 162 76 L 158 78" class="stroke-accent" stroke-width="1.5"/>
      <path d="M 25 80 Q 60 76, 100 76 Q 130 76, 148 78 Q 130 70, 100 68 Q 60 68, 25 72 Z" class="stroke-muted" stroke-width="1" opacity="0.8"/>
      <path d="M 184 44 L 168 44 M 172 40 L 168 44 L 172 48" class="stroke-accent" stroke-width="1.1"/>
    </g>
    <text x="100" y="128" class="small muted" text-anchor="middle">closed lips = mouth outline</text>
    <path d="M 100 148 L 100 172 M 95 167 L 100 172 L 105 167" class="stroke-fg" stroke-width="1"/>
    <rect x="70" y="192" width="60" height="58" class="glyph"/>
    <text x="100" y="282" class="label fg" text-anchor="middle">ㅁ  /m/</text>
    <text x="100" y="300" class="small muted" text-anchor="middle">bilabial nasal</text>
  </g>

  <!-- aside about consonant families -->
  <text x="410" y="450" class="small muted" text-anchor="middle">aspirated and tensed versions add strokes to the same base — ㄱ → ㅋ → ㄲ  ·  ㄴ → ㄷ → ㅌ → ㄸ</text>

  <!-- divider -->
  <line x1="40" y1="475" x2="780" y2="475" class="stroke-muted" stroke-width="0.6" stroke-dasharray="2 3"/>

  <!-- ===== VOWELS ===== -->
  <text x="40" y="505" class="heading fg">VOWELS — THREE PRIMITIVES, COMBINED BY POSITION</text>

  <!-- Primitives panel -->
  <g transform="translate(70, 540)">
    <text x="0" y="0" class="tiny muted">PRIMITIVES</text>

    <g transform="translate(0, 24)">
      <path d="M 5 40 L 85 40" class="glyph"/>
      <text x="45" y="100" class="small muted" text-anchor="middle">earth · flat</text>
    </g>

    <g transform="translate(100, 24)">
      <path d="M 45 5 L 45 75" class="glyph"/>
      <text x="45" y="100" class="small muted" text-anchor="middle">human · upright</text>
    </g>

    <g transform="translate(200, 24)">
      <circle cx="45" cy="40" r="8" class="fg"/>
      <text x="45" y="100" class="small muted" text-anchor="middle">heaven · point</text>
    </g>
  </g>

  <!-- Combinations panel -->
  <g transform="translate(420, 540)">
    <text x="0" y="0" class="tiny muted">DOT POSITION ENCODES QUALITY</text>

    <!-- ㅏ -->
    <g transform="translate(0, 24)">
      <path d="M 25 5 L 25 75" class="glyph"/>
      <path d="M 25 40 L 60 40" class="glyph"/>
      <text x="34" y="100" class="caption fg" text-anchor="middle">ㅏ  /a/</text>
    </g>
    <!-- ㅓ -->
    <g transform="translate(95, 24)">
      <path d="M 55 5 L 55 75" class="glyph"/>
      <path d="M 20 40 L 55 40" class="glyph"/>
      <text x="42" y="100" class="caption fg" text-anchor="middle">ㅓ  /ʌ/</text>
    </g>
    <!-- ㅗ -->
    <g transform="translate(190, 24)">
      <path d="M 5 55 L 85 55" class="glyph"/>
      <path d="M 45 20 L 45 55" class="glyph"/>
      <text x="45" y="100" class="caption fg" text-anchor="middle">ㅗ  /o/</text>
    </g>
    <!-- ㅜ -->
    <g transform="translate(285, 24)">
      <path d="M 5 30 L 85 30" class="glyph"/>
      <path d="M 45 30 L 45 65" class="glyph"/>
      <text x="45" y="100" class="caption fg" text-anchor="middle">ㅜ  /u/</text>
    </g>
  </g>

  <!-- Yin/Yang brackets -->
  <g transform="translate(420, 680)">
    <path d="M 0 0 L 0 8 L 90 8 L 90 0" class="stroke-accent" stroke-width="1"/>
    <text x="45" y="26" class="tiny accent" text-anchor="middle">YANG</text>

    <path d="M 95 0 L 95 8 L 185 8 L 185 0" class="stroke-muted" stroke-width="1"/>
    <text x="140" y="26" class="tiny muted" text-anchor="middle">YIN</text>

    <path d="M 190 0 L 190 8 L 280 8 L 280 0" class="stroke-accent" stroke-width="1"/>
    <text x="235" y="26" class="tiny accent" text-anchor="middle">YANG</text>

    <path d="M 285 0 L 285 8 L 375 8 L 375 0" class="stroke-muted" stroke-width="1"/>
    <text x="330" y="26" class="tiny muted" text-anchor="middle">YIN</text>
  </g>

  <text x="410" y="740" class="caption muted" text-anchor="middle">dot right or above → yang (bright) · dot left or below → yin (dark)</text>

  <!-- bottom divider + syllable examples -->
  <line x1="40" y1="765" x2="780" y2="765" class="stroke-muted" stroke-width="0.6" stroke-dasharray="2 3"/>
  <text x="410" y="792" class="small muted" text-anchor="middle">consonant + vowel stack into a syllable block</text>
  <text x="410" y="812" class="label fg" text-anchor="middle">ㄱ + ㅏ → 가      ㄴ + ㅜ → 누      ㅁ + ㅗ → 모</text>
</svg>
