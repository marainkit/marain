<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>The Eight Invariant Glyphs</title>
        <style>
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                    sans-serif;
                background: #ffffff;
                color: #333;
                padding: 40px 20px;
                margin: 0;
            }
            .container {
                max-width: 800px;
                margin: 0 auto;
            }
            h2 {
                font-size: 1.5em;
                margin-bottom: 0.5em;
                font-weight: 600;
            }
            .subtitle {
                font-size: 0.95em;
                color: #666;
                margin-bottom: 2em;
            }
            table {
                width: 100%;
                border-collapse: collapse;
                background: #fff;
            }
            th {
                text-align: center;
                padding: 12px 16px;
                border-bottom: 2px solid #e0e0e0;
                font-weight: 600;
                font-size: 0.9em;
            }
            td {
                padding: 20px 16px;
                border-bottom: 1px solid #e0e0e0;
                text-align: center;
            }
            td:first-child {
                text-align: left;
                width: 35%;
            }
            td:last-child {
                text-align: left;
                width: 35%;
            }
            .glyph-cell {
                display: flex;
                align-items: center;
                gap: 12px;
            }
            img {
                width: 48px;
                height: 48px;
                image-rendering: crisp-edges;
                flex-shrink: 0;
            }
            .glyph-name {
                font-size: 0.95em;
                line-height: 1.3;
            }
            .glyph-name strong {
                display: block;
                font-weight: 600;
                margin-bottom: 2px;
            }
            .glyph-index {
                font-size: 0.85em;
                color: #666;
            }
            .inverse-marker {
                color: #999;
                font-size: 1.2em;
            }
            @media (max-width: 600px) {
                body {
                    padding: 20px 16px;
                }
                td {
                    padding: 16px 12px;
                }
                img {
                    width: 40px;
                    height: 40px;
                }
                .glyph-name {
                    font-size: 0.9em;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h2>The Eight Invariant Glyphs</h2>
            <p class="subtitle">
                Fixed under every rotation and mirror reflection — the geometry
                that designs itself
            </p>

            <table>
                <thead>
                    <tr>
                        <th>Glyph</th>
                        <th></th>
                        <th>Inverse glyph</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>
                            <div class="glyph-cell">
                                <img
                                    src="https://marainkit.github.io/marain/assets/glyphs/000.png"
                                    alt="Empty glyph"
                                    loading="lazy"
                                />
                                <div class="glyph-name">
                                    <strong>Empty</strong>
                                    <span class="glyph-index">#0</span>
                                </div>
                            </div>
                        </td>
                        <td><span class="inverse-marker">↔</span></td>
                        <td>
                            <div class="glyph-cell">
                                <img
                                    src="https://marainkit.github.io/marain/assets/glyphs/511.png"
                                    alt="Full glyph"
                                    loading="lazy"
                                />
                                <div class="glyph-name">
                                    <strong>Full</strong>
                                    <span class="glyph-index">#511</span>
                                </div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <div class="glyph-cell">
                                <img
                                    src="https://marainkit.github.io/marain/assets/glyphs/016.png"
                                    alt="Point glyph"
                                    loading="lazy"
                                />
                                <div class="glyph-name">
                                    <strong>Point</strong>
                                    <span class="glyph-index">#16</span>
                                </div>
                            </div>
                        </td>
                        <td><span class="inverse-marker">↔</span></td>
                        <td>
                            <div class="glyph-cell">
                                <img
                                    src="https://marainkit.github.io/marain/assets/glyphs/495.png"
                                    alt="Frame glyph"
                                    loading="lazy"
                                />
                                <div class="glyph-name">
                                    <strong>Frame</strong>
                                    <span class="glyph-index">#495</span>
                                </div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <div class="glyph-cell">
                                <img
                                    src="https://marainkit.github.io/marain/assets/glyphs/170.png"
                                    alt="Diamond glyph"
                                    loading="lazy"
                                />
                                <div class="glyph-name">
                                    <strong>Diamond</strong>
                                    <span class="glyph-index">#170</span>
                                </div>
                            </div>
                        </td>
                        <td><span class="inverse-marker">↔</span></td>
                        <td>
                            <div class="glyph-cell">
                                <img
                                    src="https://marainkit.github.io/marain/assets/glyphs/341.png"
                                    alt="Checkerboard glyph"
                                    loading="lazy"
                                />
                                <div class="glyph-name">
                                    <strong>Checkerboard</strong>
                                    <span class="glyph-index">#341</span>
                                </div>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <div class="glyph-cell">
                                <img
                                    src="https://marainkit.github.io/marain/assets/glyphs/186.png"
                                    alt="Cross glyph"
                                    loading="lazy"
                                />
                                <div class="glyph-name">
                                    <strong>Cross</strong>
                                    <span class="glyph-index">#186</span>
                                </div>
                            </div>
                        </td>
                        <td><span class="inverse-marker">↔</span></td>
                        <td>
                            <div class="glyph-cell">
                                <img
                                    src="https://marainkit.github.io/marain/assets/glyphs/325.png"
                                    alt="Corners glyph"
                                    loading="lazy"
                                />
                                <div class="glyph-name">
                                    <strong>Corners</strong>
                                    <span class="glyph-index">#325</span>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </body>
</html>
